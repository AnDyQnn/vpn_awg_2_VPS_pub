<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Dual-Node VPN Shadow System">
  <title>Dual-Node VPN Shadow System</title>

  <!--
    Вертикальный ритм задан жёстко, чтобы подписи не наезжали друг на друга:
      78  — заголовок
      108 — подзаголовок
      196 — надпись над туннелем (умещается в промежуток между стойками 278…622)
      212 — центр серверных стоек (сами стойки занимают 154…270)
      300 — названия серверов
      322 — пояснения под названиями
      362 — нижняя строка
    Между строками не меньше 20 точек; длинные фразы центрированы в свободной зоне.
    У каждой надписи свой переливающийся градиент со своей скоростью — иначе
    одинаковое мерцание читается как дефект, а не как оформление.
  -->

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1015"/>
      <stop offset="0.5" stop-color="#131a28"/>
      <stop offset="1" stop-color="#0d1015"/>
    </linearGradient>

    <!-- заголовок: фиолетовый → белый → голубой, медленная волна -->
    <linearGradient id="gTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a9ff"/>
      <stop offset="0.5" stop-color="#e6edf3"/>
      <stop offset="1" stop-color="#79c0ff"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-0.45 0; 0.45 0; -0.45 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- подзаголовок: голубой → зелёный -->
    <linearGradient id="gSub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#9ff7a8"/>
      <stop offset="1" stop-color="#58a6ff"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-0.5 0; 0.5 0; -0.5 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- мастер: голубой холодный -->
    <linearGradient id="gMaster" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79c0ff"/>
      <stop offset="0.5" stop-color="#d2e7ff"/>
      <stop offset="1" stop-color="#3fb950"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-0.4 0; 0.4 0; -0.4 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- клиент: фиолетовый тёплый -->
    <linearGradient id="gClient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a371f7"/>
      <stop offset="0.5" stop-color="#f0d9ff"/>
      <stop offset="1" stop-color="#ff9f43"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-0.4 0; 0.4 0; -0.4 0" dur="6s" begin="-3s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- надпись над туннелем: зелёный → янтарный, быстрее остальных -->
    <linearGradient id="gTunnelText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="0.5" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#3fb950"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-0.55 0; 0.55 0; -0.55 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- приглушённые подписи: серый с голубым проблеском -->
    <linearGradient id="gMuted" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e7681"/>
      <stop offset="0.5" stop-color="#a6c8e8"/>
      <stop offset="1" stop-color="#6e7681"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-0.5 0; 0.5 0; -0.5 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="gFooter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e7681"/>
      <stop offset="0.33" stop-color="#9ff7a8"/>
      <stop offset="0.66" stop-color="#c9a9ff"/>
      <stop offset="1" stop-color="#6e7681"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-0.6 0; 0.6 0; -0.6 0" dur="12s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="tunnel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="0.5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>

    <linearGradient id="rack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2430"/>
      <stop offset="1" stop-color="#141a24"/>
    </linearGradient>

    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a371f7" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>

    <style>
      .sans { font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; }
      .mono { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }

      .node { fill: #58a6ff; animation: blink 4s ease-in-out infinite; }
      .link { stroke: #58a6ff; stroke-width: 1; animation: pulse 6s ease-in-out infinite; }
      @keyframes blink { 0%,100% { opacity:.14 } 50% { opacity:.5 } }
      @keyframes pulse { 0%,100% { opacity:.05 } 50% { opacity:.16 } }

      .rain text { animation: fall 8s linear infinite; }
      @keyframes fall { from { transform: translateY(-24px) } to { transform: translateY(420px) } }

      /* индикаторы на стойках мигают вразнобой, как настоящие */
      /* Лампочки как на реальной стойке:
           · питание — горит ровно и всегда;
           · сеть и диски — дёргаются часто и вразнобой;
           · служебная янтарная — вспыхивает редко.
         Длительности взяты не кратными друг другу, поэтому рисунок не повторяется
         и выглядит живым, а не как ровное синхронное моргание. */
      .led-power { fill: #3fb950; filter: drop-shadow(0 0 4px rgba(63,185,80,.9)); }
      .led-act   { fill: #3fb950; animation: act .37s steps(1) infinite; }
      .led-net   { fill: #58a6ff; animation: act .53s steps(1) infinite; }
      .led-warn  { fill: #d29922; animation: warn 4.3s steps(1) infinite; }
      @keyframes act  { 0%,58% { opacity:1 } 59%,100% { opacity:.1 } }
      @keyframes warn { 0%,88% { opacity:.12 } 89%,100% { opacity:1 } }

      .beam { stroke-dasharray: 12 16; animation: dash 1.8s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -56 } }

      .halo { animation: breathe 4s ease-in-out infinite; transform-origin: center; }
      @keyframes breathe { 0%,100% { opacity:.5 } 50% { opacity:1 } }

      .scan { animation: scan 3.4s cubic-bezier(.5,0,.5,1) infinite; }
      @keyframes scan {
        0%   { transform: translateY(0);     opacity: 0 }
        15%  { opacity: .5 }
        85%  { opacity: .5 }
        100% { transform: translateY(152px); opacity: 0 }
      }

      @media (prefers-reduced-motion: reduce) {
        .node,.link,.rain text,.l,.beam,.halo,.scan { animation: none }
      }
    </style>
  </defs>

  <rect width="900" height="400" fill="url(#bg)"/>

  <!-- фоновая сеть держится по краям: центр оставлен тексту -->
  <g fill="none">
    <path class="link" d="M40 60 L72 86 L40 176" style="animation-delay:-1s"/>
    <path class="link" d="M72 86 L206 52 L52 300" style="animation-delay:-2.4s"/>
    <path class="link" d="M822 70 L856 196 L846 300" style="animation-delay:-3.1s"/>
    <path class="link" d="M690 44 L822 70" style="animation-delay:-0.6s"/>
    <path class="link" d="M206 52 L292 96" style="animation-delay:-4s"/>
    <path class="link" d="M612 92 L690 44" style="animation-delay:-2.9s"/>
  </g>
  <g>
    <circle class="node" cx="48"  cy="60"  r="2.6"/>
    <circle class="node" cx="72" cy="86" r="2.6" style="animation-delay:-.8s"/>
    <circle class="node" cx="40" cy="176" r="2.6" style="animation-delay:-1.6s"/>
    <circle class="node" cx="206" cy="52"  r="2.6" style="animation-delay:-2.2s"/>
    <circle class="node" cx="292" cy="96"  r="2.6" style="animation-delay:-3s"/>
    <circle class="node" cx="52" cy="300" r="2.6" style="animation-delay:-1.1s"/>
    <circle class="node" cx="612" cy="92"  r="2.6" style="animation-delay:-2.6s"/>
    <circle class="node" cx="690" cy="44"  r="2.6" style="animation-delay:-.4s"/>
    <circle class="node" cx="822" cy="70"  r="2.6" style="animation-delay:-3.4s"/>
    <circle class="node" cx="792" cy="66"  r="2.6" style="animation-delay:-1.9s"/>
    <circle class="node" cx="852" cy="136" r="2.6" style="animation-delay:-2.8s"/>
    <circle class="node" cx="856" cy="196" r="2.6" style="animation-delay:-.2s"/>
    <circle class="node" cx="846" cy="300" r="2.6" style="animation-delay:-3.8s"/>
  </g>

  <!-- падающий код по краям -->
  <g class="rain mono" font-size="12" fill="#3fb950" opacity=".13">
    <text x="30"  y="0">01</text>
    <text x="168" y="0" style="animation-delay:-2.5s">{}</text>
    <text x="726" y="0" style="animation-delay:-4.8s">1101</text>
    <text x="862" y="0" style="animation-delay:-3.6s">0x1F</text>
  </g>

  <!-- заголовок -->
  <text x="450" y="78" class="sans" font-size="40" font-weight="800" text-anchor="middle" fill="url(#gTitle)">
    Dual-Node VPN Shadow System
  </text>
  <text x="450" y="108" class="sans" font-size="16" text-anchor="middle" fill="url(#gSub)">
    Два сервера, один туннель, управление из Telegram
  </text>

  <!-- узлы и туннель -->
  <g>
    <ellipse cx="170" cy="212" rx="128" ry="92" fill="url(#halo)" class="halo"/>
    <ellipse cx="730" cy="212" rx="128" ry="92" fill="url(#halo2)" class="halo" style="animation-delay:-2s"/>

    <g transform="translate(170,212)">
      <rect x="-62" y="-78" width="124" height="156" rx="12" fill="url(#rack)" stroke="#30363d" stroke-width="1.2"/>
      <g stroke="#2b3340" stroke-width="1.2">
        <line x1="-46" y1="-40" x2="46" y2="-40"/>
        <line x1="-46" y1="-2"  x2="46" y2="-2"/>
        <line x1="-46" y1="36"  x2="46" y2="36"/>
      </g>
      <g>
        <rect class="l lg steady" x="16" y="-60" width="8" height="8" rx="2"/>
        <rect class="l lb" x="28" y="-60" width="8" height="8" rx="2" style="animation-duration:0.81s;animation-delay:-0.45s"/>
        <rect class="l la" x="40" y="-60" width="8" height="8" rx="2" style="animation-duration:1.34s;animation-delay:-0.22s"/>
        <rect class="l lg" x="16" y="-22" width="8" height="8" rx="2" style="animation-duration:1.15s;animation-delay:-1.1s"/>
        <rect class="l lb" x="28" y="-22" width="8" height="8" rx="2" style="animation-duration:0.38s;animation-delay:-1.52s"/>
        <rect class="l la" x="40" y="-22" width="8" height="8" rx="2" style="animation-duration:0.35s;animation-delay:-1.3s"/>
        <rect class="l lg" x="16" y="16" width="8" height="8" rx="2" style="animation-duration:0.4s;animation-delay:-0.27s"/>
        <rect class="l lb" x="28" y="16" width="8" height="8" rx="2" style="animation-duration:0.97s;animation-delay:-2.48s"/>
        <rect class="l la" x="40" y="16" width="8" height="8" rx="2" style="animation-duration:0.49s;animation-delay:-0.67s"/>
        <rect class="l lg" x="16" y="54" width="8" height="8" rx="2" style="animation-duration:1.3s;animation-delay:-2.84s"/>
        <rect class="l lb" x="28" y="54" width="8" height="8" rx="2" style="animation-duration:1.22s;animation-delay:-1.19s"/>
        <rect class="l la" x="40" y="54" width="8" height="8" rx="2" style="animation-duration:1.86s;animation-delay:-0.14s"/>
      </g>
      <g fill="#58a6ff" opacity=".5">
        <rect x="-46" y="-60" width="30" height="7" rx="2.5"/>
        <rect x="-46" y="-22" width="22" height="7" rx="2.5"/>
        <rect x="-46" y="16"  width="35" height="7" rx="2.5"/>
        <rect x="-46" y="54"  width="19" height="7" rx="2.5"/>
      </g>
    </g>
    <g transform="translate(730,212)">
      <rect x="-62" y="-78" width="124" height="156" rx="12" fill="url(#rack)" stroke="#30363d" stroke-width="1.2"/>
      <g stroke="#2b3340" stroke-width="1.2">
        <line x1="-46" y1="-40" x2="46" y2="-40"/>
        <line x1="-46" y1="-2"  x2="46" y2="-2"/>
        <line x1="-46" y1="36"  x2="46" y2="36"/>
      </g>
      <g>
        <rect class="l lg steady" x="16" y="-60" width="8" height="8" rx="2"/>
        <rect class="l lb" x="28" y="-60" width="8" height="8" rx="2" style="animation-duration:0.56s;animation-delay:-2.07s"/>
        <rect class="l la" x="40" y="-60" width="8" height="8" rx="2" style="animation-duration:1.31s;animation-delay:-1.44s"/>
        <rect class="l lg" x="16" y="-22" width="8" height="8" rx="2" style="animation-duration:0.64s;animation-delay:-2.38s"/>
        <rect class="l lb" x="28" y="-22" width="8" height="8" rx="2" style="animation-duration:1.59s;animation-delay:-1.54s"/>
        <rect class="l la" x="40" y="-22" width="8" height="8" rx="2" style="animation-duration:1.1s;animation-delay:-0.71s"/>
        <rect class="l lg" x="16" y="16" width="8" height="8" rx="2" style="animation-duration:0.3s;animation-delay:-1.11s"/>
        <rect class="l lb" x="28" y="16" width="8" height="8" rx="2" style="animation-duration:1.23s;animation-delay:-0.21s"/>
        <rect class="l la" x="40" y="16" width="8" height="8" rx="2" style="animation-duration:1.57s;animation-delay:-0.7s"/>
        <rect class="l lg" x="16" y="54" width="8" height="8" rx="2" style="animation-duration:0.66s;animation-delay:-0.13s"/>
        <rect class="l lb" x="28" y="54" width="8" height="8" rx="2" style="animation-duration:1.9s;animation-delay:-2.22s"/>
        <rect class="l la" x="40" y="54" width="8" height="8" rx="2" style="animation-duration:1.7s;animation-delay:-1.85s"/>
      </g>
      <g fill="#58a6ff" opacity=".5">
        <rect x="-46" y="-60" width="30" height="7" rx="2.5"/>
        <rect x="-46" y="-22" width="22" height="7" rx="2.5"/>
        <rect x="-46" y="16"  width="35" height="7" rx="2.5"/>
        <rect x="-46" y="54"  width="19" height="7" rx="2.5"/>
      </g>
    </g>

    <rect class="scan" x="108" y="134" width="124" height="2" fill="#9ff7a8" opacity="0"/>
    <rect class="scan" x="668" y="134" width="124" height="2" fill="#d2a8ff" opacity="0" style="animation-delay:-1.7s"/>

    <text x="450" y="196" class="sans" font-size="13.5" text-anchor="middle" fill="url(#gTunnelText)">
      туннель поднимает клиент-сервер
    </text>

    <line x1="240" y1="212" x2="660" y2="212" stroke="url(#tunnel)" stroke-width="2" opacity=".45"/>
    <line x1="240" y1="212" x2="660" y2="212" stroke="url(#tunnel)" stroke-width="2.5" class="beam"/>

    <circle r="4" cy="212" fill="#9ff7a8">
      <animate attributeName="cx" values="240;660" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" cy="212" fill="#d2a8ff" opacity="0">
      <animate attributeName="cx" values="660;240" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
    </circle>

    <text x="170" y="316" class="sans" font-size="20" font-weight="700" text-anchor="middle" fill="url(#gMaster)">Master Server</text>
    <text x="170" y="338" class="sans" font-size="13" text-anchor="middle" fill="url(#gMuted)">принимает людей, решает маршруты</text>

    <text x="730" y="316" class="sans" font-size="20" font-weight="700" text-anchor="middle" fill="url(#gClient)">Client Server</text>
    <text x="730" y="338" class="sans" font-size="13" text-anchor="middle" fill="url(#gMuted)">выпускает трафик наружу</text>
  </g>

  <text x="450" y="382" class="sans" font-size="13" text-anchor="middle" fill="url(#gFooter)">
    учёт нагрузки в пакетах · самовосстановление · шифрованные копии
  </text>
</svg>
