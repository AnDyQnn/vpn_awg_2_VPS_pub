<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="Dual-Node VPN Shadow System">
  <title>Dual-Node VPN Shadow System</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1015"/>
      <stop offset="0.5" stop-color="#131a28"/>
      <stop offset="1" stop-color="#0d1015"/>
    </linearGradient>

    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a9ff"/>
      <stop offset="0.5" stop-color="#e6edf3"/>
      <stop offset="1" stop-color="#79c0ff"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-0.45 0; 0.45 0; -0.45 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="tunnel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="0.5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>

    <linearGradient id="rack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2430"/>
      <stop offset="1" stop-color="#141a24"/>
    </linearGradient>

    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a371f7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>

    <style>
      .sans { font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; }
      .mono { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }

      .node  { fill: #58a6ff; animation: blink 4s ease-in-out infinite; }
      .link  { stroke: #58a6ff; stroke-width: 1; animation: pulse 6s ease-in-out infinite; }
      @keyframes blink { 0%,100% { opacity:.16 } 50% { opacity:.55 } }
      @keyframes pulse { 0%,100% { opacity:.05 } 50% { opacity:.18 } }

      .rain text { animation: fall 8s linear infinite; }
      @keyframes fall { from { transform: translateY(-30px) } to { transform: translateY(370px) } }

      /* индикаторы на стойках — живут вразнобой, как настоящие */
      .led { animation: led 1.6s steps(1) infinite; }
      @keyframes led { 0%,60% { opacity:1 } 61%,100% { opacity:.25 } }

      .beam { stroke-dasharray: 12 16; animation: dash 1.8s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -56 } }

      .halo { animation: breathe 4s ease-in-out infinite; transform-origin: center; }
      @keyframes breathe { 0%,100% { opacity:.5 } 50% { opacity:1 } }

      .scan { animation: scan 3.4s cubic-bezier(.5,0,.5,1) infinite; }
      @keyframes scan { 0% { transform: translateY(0); opacity:0 }
                        15% { opacity:.55 }
                        85% { opacity:.55 }
                        100% { transform: translateY(96px); opacity:0 } }

      @media (prefers-reduced-motion: reduce) {
        .node,.link,.rain text,.led,.beam,.halo,.scan { animation: none }
      }
    </style>

    <!-- серверная стойка: рисуем один раз, ставим дважды -->
    <g id="server">
      <rect x="-46" y="-58" width="92" height="116" rx="9" fill="url(#rack)" stroke="#30363d"/>
      <g stroke="#2b3340" stroke-width="1">
        <line x1="-34" y1="-30" x2="34" y2="-30"/>
        <line x1="-34" y1="-2"  x2="34" y2="-2"/>
        <line x1="-34" y1="26"  x2="34" y2="26"/>
      </g>
      <g fill="#3fb950">
        <rect class="led" x="26" y="-44" width="6" height="6" rx="1.5"/>
        <rect class="led" x="26" y="-16" width="6" height="6" rx="1.5" style="animation-delay:-.5s"/>
        <rect class="led" x="26" y="12"  width="6" height="6" rx="1.5" style="animation-delay:-1.1s"/>
        <rect class="led" x="26" y="40"  width="6" height="6" rx="1.5" style="animation-delay:-1.4s"/>
      </g>
      <g fill="#58a6ff" opacity=".55">
        <rect x="-34" y="-44" width="22" height="5" rx="2"/>
        <rect x="-34" y="-16" width="16" height="5" rx="2"/>
        <rect x="-34" y="12"  width="26" height="5" rx="2"/>
        <rect x="-34" y="40"  width="14" height="5" rx="2"/>
      </g>
    </g>
  </defs>

  <rect width="900" height="340" fill="url(#bg)"/>

  <!-- фоновая сеть -->
  <g class="links" fill="none">
    <path class="link" d="M56 66 L140 118 L98 222" style="animation-delay:-1s"/>
    <path class="link" d="M140 118 L232 59 L302 155" style="animation-delay:-2.4s"/>
    <path class="link" d="M774 74 L836 148 L745 222" style="animation-delay:-3.1s"/>
    <path class="link" d="M619 52 L710 104 L668 200" style="animation-delay:-0.6s"/>
    <path class="link" d="M302 155 L380 81" style="animation-delay:-4s"/>
    <path class="link" d="M520 214 L604 133" style="animation-delay:-2.9s"/>
  </g>
  <g>
    <circle class="node" cx="56"  cy="66"  r="2.6"/>
    <circle class="node" cx="140" cy="118" r="2.6" style="animation-delay:-.8s"/>
    <circle class="node" cx="98"  cy="222" r="2.6" style="animation-delay:-1.6s"/>
    <circle class="node" cx="232" cy="59"  r="2.6" style="animation-delay:-2.2s"/>
    <circle class="node" cx="302" cy="155" r="2.6" style="animation-delay:-3s"/>
    <circle class="node" cx="380" cy="81"  r="2.6" style="animation-delay:-1.1s"/>
    <circle class="node" cx="520" cy="214" r="2.6" style="animation-delay:-2.6s"/>
    <circle class="node" cx="604" cy="133" r="2.6" style="animation-delay:-.4s"/>
    <circle class="node" cx="619" cy="52"  r="2.6" style="animation-delay:-3.4s"/>
    <circle class="node" cx="710" cy="104" r="2.6" style="animation-delay:-1.9s"/>
    <circle class="node" cx="774" cy="74"  r="2.6" style="animation-delay:-2.8s"/>
    <circle class="node" cx="836" cy="148" r="2.6" style="animation-delay:-.2s"/>
    <circle class="node" cx="745" cy="222" r="2.6" style="animation-delay:-3.8s"/>
  </g>

  <!-- падающий код -->
  <g class="rain mono" font-size="12" fill="#3fb950" opacity=".14">
    <text x="40"  y="0">01</text>
    <text x="172" y="0" style="animation-delay:-2.5s">{}</text>
    <text x="327" y="0" style="animation-delay:-4.8s">1101</text>
    <text x="573" y="0" style="animation-delay:-1.2s">&lt;/&gt;</text>
    <text x="791" y="0" style="animation-delay:-3.6s">0x1F</text>
  </g>

  <!-- заголовок -->
  <text x="450" y="84" class="sans" font-size="42" font-weight="800" text-anchor="middle" fill="url(#title)">
    Dual-Node VPN Shadow System
  </text>
  <text x="450" y="114" class="sans" font-size="17" text-anchor="middle" fill="#8b949e">
    Два сервера, один туннель, управление из Telegram
  </text>

  <!-- два узла и туннель между ними -->
  <g transform="translate(0,218)">
    <ellipse cx="232" cy="0" rx="110" ry="62" fill="url(#halo)" class="halo"/>
    <ellipse cx="668" cy="0" rx="110" ry="62" fill="url(#halo2)" class="halo" style="animation-delay:-2s"/>

    <use href="#server" x="232" y="0"/>
    <use href="#server" x="668" y="0"/>

    <rect class="scan" x="186" y="-58" width="92" height="2" fill="#9ff7a8" opacity="0"/>
    <rect class="scan" x="622" y="-58" width="92" height="2" fill="#d2a8ff" opacity="0" style="animation-delay:-1.7s"/>

    <text x="232" y="84" class="sans" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="middle">Мастер-сервер</text>
    <text x="232" y="106" class="sans" font-size="14" fill="#8b949e" text-anchor="middle">принимает людей и решает маршруты</text>

    <text x="668" y="84" class="sans" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="middle">Клиент-сервер</text>
    <text x="668" y="106" class="sans" font-size="14" fill="#8b949e" text-anchor="middle">выпускает трафик наружу</text>

    <line x1="284" y1="0" x2="612" y2="0" stroke="url(#tunnel)" stroke-width="2" opacity=".45"/>
    <line x1="284" y1="0" x2="612" y2="0" stroke="url(#tunnel)" stroke-width="2.5" class="beam"/>

    <circle r="4" cy="0" fill="#9ff7a8">
      <animate attributeName="cx" values="284;612" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" cy="0" fill="#d2a8ff" opacity="0">
      <animate attributeName="cx" values="612;284" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
    </circle>

    <text x="448" y="-20" class="sans" font-size="14" fill="#a6adb8" text-anchor="middle">туннель поднимает клиент-сервер</text>
    <text x="448" y="26" class="sans" font-size="12.5" fill="#6e7681" text-anchor="middle">снаружи это выглядит как обычное входящее соединение</text>
  </g>

  <text x="450" y="326" class="sans" font-size="13.5" text-anchor="middle" fill="#6e7681">
    учёт нагрузки в пакетах · самовосстановление · шифрованные копии
  </text>
</svg>
