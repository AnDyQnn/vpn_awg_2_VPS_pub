<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Dual-Node VPN Shadow System">
  <title>Dual-Node VPN Shadow System</title>

  <!--
    ВАЖНО ПРО ОФОРМЛЕНИЕ. GitHub при вставке SVG в README вырезает и атрибут style,
    и блок <style> целиком. Поэтому здесь нет ни одного класса и ни одной строки CSS:
    все цвета заданы атрибутами, вся анимация — элементами SMIL (animate). Проверено
    на практике: с CSS лампочки сначала горели ровно, потом стали мигать чёрными.

    Вертикальный ритм (чтобы подписи не наезжали):
      78  — заголовок
      108 — подзаголовок
      196 — надпись над туннелем (влезает в промежуток между стойками 232…668)
      212 — центр стоек (сами стойки занимают по высоте 134…290)
      316 — названия серверов
      338 — пояснения
      382 — нижняя строка
  -->

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1015"/>
      <stop offset="0.5" stop-color="#131a28"/>
      <stop offset="1" stop-color="#0d1015"/>
    </linearGradient>

    <linearGradient id="gTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a9ff"/>
      <stop offset="0.5" stop-color="#e6edf3"/>
      <stop offset="1" stop-color="#79c0ff"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-0.45 0; 0.45 0; -0.45 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="gSub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#9ff7a8"/>
      <stop offset="1" stop-color="#58a6ff"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-0.5 0; 0.5 0; -0.5 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="gMaster" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79c0ff"/>
      <stop offset="0.5" stop-color="#d2e7ff"/>
      <stop offset="1" stop-color="#3fb950"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-0.4 0; 0.4 0; -0.4 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="gClient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a371f7"/>
      <stop offset="0.5" stop-color="#f0d9ff"/>
      <stop offset="1" stop-color="#ff9f43"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-0.4 0; 0.4 0; -0.4 0" dur="6s" begin="-3s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="gTunnelText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="0.5" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#3fb950"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-0.55 0; 0.55 0; -0.55 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="gMuted" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e7681"/>
      <stop offset="0.5" stop-color="#a6c8e8"/>
      <stop offset="1" stop-color="#6e7681"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-0.5 0; 0.5 0; -0.5 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="gFooter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e7681"/>
      <stop offset="0.33" stop-color="#9ff7a8"/>
      <stop offset="0.66" stop-color="#c9a9ff"/>
      <stop offset="1" stop-color="#6e7681"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-0.6 0; 0.6 0; -0.6 0" dur="12s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Координаты в пользовательской системе, а не в долях рамки объекта: у
         горизонтальной линии высота рамки нулевая, и градиент по долям вырождается —
         линия туннеля просто не рисовалась. -->
    <linearGradient id="tunnel" gradientUnits="userSpaceOnUse" x1="240" y1="212" x2="660" y2="212">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="0.5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>

    <linearGradient id="rack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2430"/>
      <stop offset="1" stop-color="#141a24"/>
    </linearGradient>

    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a371f7" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="400" fill="url(#bg)"/>

  <!-- фоновая сеть: каждая точка лежит на линии, висящих узлов нет -->
  <g fill="none" stroke="#58a6ff" stroke-width="1">
    <path d="M40 60 L96 86 L40 176 L52 300" opacity="0.05">
      <animate attributeName="opacity" values="0.05;0.18;0.05" dur="6s" begin="-1s" repeatCount="indefinite"/>
    </path>
    <path d="M96 86 L206 52 L292 96" opacity="0.05">
      <animate attributeName="opacity" values="0.05;0.18;0.05" dur="6s" begin="-2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M612 92 L690 44 L822 70" opacity="0.05">
      <animate attributeName="opacity" values="0.05;0.18;0.05" dur="6s" begin="-3.1s" repeatCount="indefinite"/>
    </path>
    <path d="M822 70 L856 196 L846 300" opacity="0.05">
      <animate attributeName="opacity" values="0.05;0.18;0.05" dur="6s" begin="-0.6s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#58a6ff">
    <circle cx="40"  cy="60"  r="2.8"><animate attributeName="opacity" values="0.14;0.55;0.14" dur="4s" begin="0s"     repeatCount="indefinite"/></circle>
    <circle cx="96"  cy="86"  r="2.8"><animate attributeName="opacity" values="0.14;0.55;0.14" dur="4s" begin="-0.8s"  repeatCount="indefinite"/></circle>
    <circle cx="40"  cy="176" r="2.8"><animate attributeName="opacity" values="0.14;0.55;0.14" dur="4s" begin="-1.6s"  repeatCount="indefinite"/></circle>
    <circle cx="52"  cy="300" r="2.8"><animate attributeName="opacity" values="0.14;0.55;0.14" dur="4s" begin="-2.2s"  repeatCount="indefinite"/></circle>
    <circle cx="206" cy="52"  r="2.8"><animate attributeName="opacity" values="0.14;0.55;0.14" dur="4s" begin="-3s"    repeatCount="indefinite"/></circle>
    <circle cx="292" cy="96"  r="2.8"><animate attributeName="opacity" values="0.14;0.55;0.14" dur="4s" begin="-1.1s"  repeatCount="indefinite"/></circle>
    <circle cx="612" cy="92"  r="2.8"><animate attributeName="opacity" values="0.14;0.55;0.14" dur="4s" begin="-2.6s"  repeatCount="indefinite"/></circle>
    <circle cx="690" cy="44"  r="2.8"><animate attributeName="opacity" values="0.14;0.55;0.14" dur="4s" begin="-0.4s"  repeatCount="indefinite"/></circle>
    <circle cx="822" cy="70"  r="2.8"><animate attributeName="opacity" values="0.14;0.55;0.14" dur="4s" begin="-3.4s"  repeatCount="indefinite"/></circle>
    <circle cx="856" cy="196" r="2.8"><animate attributeName="opacity" values="0.14;0.55;0.14" dur="4s" begin="-1.9s"  repeatCount="indefinite"/></circle>
    <circle cx="846" cy="300" r="2.8"><animate attributeName="opacity" values="0.14;0.55;0.14" dur="4s" begin="-2.8s"  repeatCount="indefinite"/></circle>
  </g>

  <!-- падающий код по краям -->
  <g fill="#3fb950" opacity="0.13" font-family="ui-monospace, Consolas, monospace" font-size="12">
    <text x="30" y="0">01
      <animateTransform attributeName="transform" type="translate" values="0 -24; 0 420" dur="8s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="168" y="0">{}
      <animateTransform attributeName="transform" type="translate" values="0 -24; 0 420" dur="8s" begin="-2.5s" repeatCount="indefinite"/>
    </text>
    <text x="726" y="0">1101
      <animateTransform attributeName="transform" type="translate" values="0 -24; 0 420" dur="8s" begin="-4.8s" repeatCount="indefinite"/>
    </text>
    <text x="862" y="0">0x1F
      <animateTransform attributeName="transform" type="translate" values="0 -24; 0 420" dur="8s" begin="-3.6s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- заголовок -->
  <text x="450" y="78" font-family="Segoe UI, system-ui, sans-serif" font-size="40" font-weight="800"
        text-anchor="middle" fill="url(#gTitle)">Dual-Node VPN Shadow System</text>
  <text x="450" y="108" font-family="Segoe UI, system-ui, sans-serif" font-size="16"
        text-anchor="middle" fill="url(#gSub)">Два сервера, один туннель, управление из Telegram</text>

  <!-- подсветка под стойками -->
  <ellipse cx="170" cy="212" rx="128" ry="92" fill="url(#halo)" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="730" cy="212" rx="128" ry="92" fill="url(#halo2)" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" begin="-2s" repeatCount="indefinite"/>
  </ellipse>

  <!-- МАСТЕР-СЕРВЕР -->
  <g transform="translate(170,212)">
    <rect x="-62" y="-78" width="124" height="156" rx="12" fill="url(#rack)" stroke="#30363d" stroke-width="1.2"/>
    <g stroke="#2b3340" stroke-width="1.2">
      <line x1="-46" y1="-40" x2="46" y2="-40"/>
      <line x1="-46" y1="-2"  x2="46" y2="-2"/>
      <line x1="-46" y1="36"  x2="46" y2="36"/>
    </g>
    <g fill="#58a6ff" opacity="0.5">
      <rect x="-46" y="-60" width="30" height="7" rx="2.5"/>
      <rect x="-46" y="-22" width="22" height="7" rx="2.5"/>
      <rect x="-46" y="16"  width="35" height="7" rx="2.5"/>
      <rect x="-46" y="54"  width="19" height="7" rx="2.5"/>
    </g>

    <!-- гирлянда: зелёная питание/активность, голубая сеть, янтарная служебная -->
    <rect x="16" y="-60" width="8" height="8" rx="2" fill="#3fb950"/>
    <rect x="28" y="-60" width="8" height="8" rx="2" fill="#58a6ff"><animate attributeName="opacity" values="1;0.08" keyTimes="0;0.55" calcMode="discrete" dur="0.41s" begin="-0.2s" repeatCount="indefinite"/></rect>
    <rect x="40" y="-60" width="8" height="8" rx="2" fill="#d29922"><animate attributeName="opacity" values="1;0.08" keyTimes="0;0.9"  calcMode="discrete" dur="3.7s"  begin="-1.1s" repeatCount="indefinite"/></rect>

    <rect x="16" y="-22" width="8" height="8" rx="2" fill="#3fb950"><animate attributeName="opacity" values="1;0.08" keyTimes="0;0.55" calcMode="discrete" dur="0.29s" begin="-0.5s" repeatCount="indefinite"/></rect>
    <rect x="28" y="-22" width="8" height="8" rx="2" fill="#58a6ff"><animate attributeName="opacity" values="1;0.08" keyTimes="0;0.55" calcMode="discrete" dur="0.67s" begin="-1.3s" repeatCount="indefinite"/></rect>
    <rect x="40" y="-22" width="8" height="8" rx="2" fill="#d29922"><animate attributeName="opacity" values="1;0.08" keyTimes="0;0.92" calcMode="discrete" dur="5.1s"  begin="-2.4s" repeatCount="indefinite"/></rect>

    <rect x="16" y="16" width="8" height="8" rx="2" fill="#3fb950"><animate attributeName="opacity" values="1;0.08" keyTimes="0;0.55" calcMode="discrete" dur="0.53s" begin="-0.9s" repeatCount="indefinite"/></rect>
    <rect x="28" y="16" width="8" height="8" rx="2" fill="#58a6ff"><animate attributeName="opacity" values="1;0.08" keyTimes="0;0.55" calcMode="discrete" dur="0.37s" begin="-0.1s" repeatCount="indefinite"/></rect>
    <rect x="40" y="16" width="8" height="8" rx="2" fill="#d29922"><animate attributeName="opacity" values="1;0.08" keyTimes="0;0.88" calcMode="discrete" dur="4.3s"  begin="-3.2s" repeatCount="indefinite"/></rect>

    <rect x="16" y="54" width="8" height="8" rx="2" fill="#3fb950"><animate attributeName="opacity" values="1;0.08" keyTimes="0;0.55" calcMode="discrete" dur="0.83s" begin="-0.35s" repeatCount="indefinite"/></rect>
    <rect x="28" y="54" width="8" height="8" rx="2" fill="#58a6ff"><animate attributeName="opacity" values="1;0.08" keyTimes="0;0.55" calcMode="discrete" dur="1.13s" begin="-0.7s" repeatCount="indefinite"/></rect>
    <rect x="40" y="54" width="8" height="8" rx="2" fill="#d29922"><animate attributeName="opacity" values="1;0.08" keyTimes="0;0.9"  calcMode="discrete" dur="6.2s"  begin="-4.5s" repeatCount="indefinite"/></rect>

    <!-- луч сканирования -->
    <rect x="-62" y="-78" width="124" height="2" fill="#9ff7a8" opacity="0">
      <animate attributeName="opacity" values="0;0.5;0.5;0" keyTimes="0;0.15;0.85;1" dur="3.4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 156" dur="3.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- КЛИЕНТ-СЕРВЕР -->
  <g transform="translate(730,212)">
    <rect x="-62" y="-78" width="124" height="156" rx="12" fill="url(#rack)" stroke="#30363d" stroke-width="1.2"/>
    <g stroke="#2b3340" stroke-width="1.2">
      <line x1="-46" y1="-40" x2="46" y2="-40"/>
      <line x1="-46" y1="-2"  x2="46" y2="-2"/>
      <line x1="-46" y1="36"  x2="46" y2="36"/>
    </g>
    <g fill="#a371f7" opacity="0.45">
      <rect x="-46" y="-60" width="26" height="7" rx="2.5"/>
      <rect x="-46" y="-22" width="34" height="7" rx="2.5"/>
      <rect x="-46" y="16"  width="20" height="7" rx="2.5"/>
      <rect x="-46" y="54"  width="30" height="7" rx="2.5"/>
    </g>

    <rect x="16" y="-60" width="8" height="8" rx="2" fill="#3fb950"/>
    <rect x="28" y="-60" width="8" height="8" rx="2" fill="#58a6ff"><animate attributeName="opacity" values="1;0.08" keyTimes="0;0.55" calcMode="discrete" dur="0.61s" begin="-0.7s" repeatCount="indefinite"/></rect>
    <rect x="40" y="-60" width="8" height="8" rx="2" fill="#d29922"><animate attributeName="opacity" values="1;0.08" keyTimes="0;0.91" calcMode="discrete" dur="4.9s"  begin="-0.4s" repeatCount="indefinite"/></rect>

    <rect x="16" y="-22" width="8" height="8" rx="2" fill="#3fb950"><animate attributeName="opacity" values="1;0.08" keyTimes="0;0.55" calcMode="discrete" dur="0.34s" begin="-1.1s" repeatCount="indefinite"/></rect>
    <rect x="28" y="-22" width="8" height="8" rx="2" fill="#58a6ff"><animate attributeName="opacity" values="1;0.08" keyTimes="0;0.55" calcMode="discrete" dur="0.47s" begin="-0.25s" repeatCount="indefinite"/></rect>
    <rect x="40" y="-22" width="8" height="8" rx="2" fill="#d29922"><animate attributeName="opacity" values="1;0.08" keyTimes="0;0.87" calcMode="discrete" dur="3.3s"  begin="-2.8s" repeatCount="indefinite"/></rect>

    <rect x="16" y="16" width="8" height="8" rx="2" fill="#3fb950"><animate attributeName="opacity" values="1;0.08" keyTimes="0;0.55" calcMode="discrete" dur="0.92s" begin="-0.15s" repeatCount="indefinite"/></rect>
    <rect x="28" y="16" width="8" height="8" rx="2" fill="#58a6ff"><animate attributeName="opacity" values="1;0.08" keyTimes="0;0.55" calcMode="discrete" dur="0.31s" begin="-1.9s" repeatCount="indefinite"/></rect>
    <rect x="40" y="16" width="8" height="8" rx="2" fill="#d29922"><animate attributeName="opacity" values="1;0.08" keyTimes="0;0.93" calcMode="discrete" dur="5.6s"  begin="-1.2s" repeatCount="indefinite"/></rect>

    <rect x="16" y="54" width="8" height="8" rx="2" fill="#3fb950"><animate attributeName="opacity" values="1;0.08" keyTimes="0;0.55" calcMode="discrete" dur="0.44s" begin="-0.8s" repeatCount="indefinite"/></rect>
    <rect x="28" y="54" width="8" height="8" rx="2" fill="#58a6ff"><animate attributeName="opacity" values="1;0.08" keyTimes="0;0.55" calcMode="discrete" dur="0.76s" begin="-2.1s" repeatCount="indefinite"/></rect>
    <rect x="40" y="54" width="8" height="8" rx="2" fill="#d29922"><animate attributeName="opacity" values="1;0.08" keyTimes="0;0.89" calcMode="discrete" dur="4.1s"  begin="-3.9s" repeatCount="indefinite"/></rect>

    <rect x="-62" y="-78" width="124" height="2" fill="#d2a8ff" opacity="0">
      <animate attributeName="opacity" values="0;0.5;0.5;0" keyTimes="0;0.15;0.85;1" dur="3.4s" begin="-1.7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 156" dur="3.4s" begin="-1.7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- туннель -->
  <text x="450" y="196" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5"
        text-anchor="middle" fill="url(#gTunnelText)">туннель поднимает клиент-сервер</text>

  <line x1="240" y1="212" x2="660" y2="212" stroke="url(#tunnel)" stroke-width="2" opacity="0.45"/>
  <line x1="240" y1="212" x2="660" y2="212" stroke="url(#tunnel)" stroke-width="2.5" stroke-dasharray="12 16">
    <animate attributeName="stroke-dashoffset" from="0" to="-56" dur="1.8s" repeatCount="indefinite"/>
  </line>

  <circle r="4" cy="212" fill="#9ff7a8">
    <animate attributeName="cx" values="240;660" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" cy="212" fill="#d2a8ff" opacity="0">
    <animate attributeName="cx" values="660;240" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
  </circle>

  <!-- подписи -->
  <text x="170" y="316" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700"
        text-anchor="middle" fill="url(#gMaster)">Master Server</text>
  <text x="170" y="338" font-family="Segoe UI, system-ui, sans-serif" font-size="13"
        text-anchor="middle" fill="url(#gMuted)">принимает людей, решает маршруты</text>

  <text x="730" y="316" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700"
        text-anchor="middle" fill="url(#gClient)">Client Server</text>
  <text x="730" y="338" font-family="Segoe UI, system-ui, sans-serif" font-size="13"
        text-anchor="middle" fill="url(#gMuted)">выпускает трафик наружу</text>

  <text x="450" y="382" font-family="Segoe UI, system-ui, sans-serif" font-size="13"
        text-anchor="middle" fill="url(#gFooter)">учёт нагрузки в пакетах · самовосстановление · шифрованные копии</text>
</svg>
