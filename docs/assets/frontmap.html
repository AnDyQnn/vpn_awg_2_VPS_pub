<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта экранов бота</title>
<!--
  Обзорная карта фронта: что видит человек, нажимая кнопки в боте.

  Откуда берутся данные. Из самого кода — их собирает `build_frontmap.py` и
  кладёт рядом в `frontmap.data.js`. Карта, нарисованная руками, врёт на второй
  день: кнопку переименовали, экран добавили, ветку убрали. Здесь врать нечему.

  Что здесь можно делать, и что из этого доедет до людей.

  ПОДПИСИ — настоящая настройка. Переименованная здесь кнопка выгружается в
  плоский конфиг `config/buttons.json`: ключ — адрес нажатия, значение — то, что
  увидит человек. Бот читает этот файл при запуске, править код не нужно.
  Подпись привязана к адресу, а не к месту, поэтому меняется сразу на всех
  экранах, где эта кнопка нарисована, — сколько их, написано под кнопкой.

  РАСКЛАДКА — порядок кнопок, переносы между экранами, положение карточек —
  остаётся наброском. Плоским словарём её не выразить: порядок живёт в коде
  рядом с условиями вроде «эту строку показываем, только если есть Xray».
  Такие правки видно списком, переносить их в код нужно руками.

  Всё сохраняется в браузере и переживает закрытие страницы.
-->
<style>
:root{
  --bg:#0e1116; --bg2:#161b22; --bg3:#1c2430;
  --fg:#c9d1d9; --muted:#8b949e; --accent:#58a6ff;
  --good:#3fb950; --border:#30363d; --red:#f85149;
  --amber:#d29922; --violet:#a371f7;
  --font-body:"Segoe UI",system-ui,sans-serif;
  --font-mono:ui-monospace,Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);
     font-size:14px;overflow:hidden}

/* ---------- верхняя панель ---------- */
header{position:fixed;inset:0 0 auto 0;height:52px;z-index:30;display:flex;
       align-items:center;gap:8px;padding:0 14px;background:rgba(14,17,22,.94);
       border-bottom:1px solid var(--border);backdrop-filter:blur(6px);
       flex-wrap:nowrap;overflow-x:auto}
h1{font-size:15px;margin:0 10px 0 0;white-space:nowrap;font-weight:600}
h1 small{color:var(--muted);font-weight:400;margin-left:6px}
.tabs{display:flex;gap:2px;background:var(--bg2);border:1px solid var(--border);
      border-radius:8px;padding:2px}
.tabs button{background:none;border:0;color:var(--muted);padding:5px 12px;
             border-radius:6px;cursor:pointer;font:inherit;white-space:nowrap}
.tabs button.on{background:var(--bg3);color:var(--fg)}
.btn{background:var(--bg2);border:1px solid var(--border);color:var(--fg);
     padding:6px 11px;border-radius:7px;cursor:pointer;font:inherit;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.warn:hover{border-color:var(--red);color:var(--red)}
input[type=search]{background:var(--bg2);border:1px solid var(--border);
  color:var(--fg);padding:6px 10px;border-radius:7px;font:inherit;min-width:150px}
label.chk{display:flex;align-items:center;gap:6px;color:var(--muted);
          white-space:nowrap;cursor:pointer}
.spacer{flex:1}
.count{color:var(--muted);font-size:12px;white-space:nowrap}

/* ---------- полотно ---------- */
#canvas{position:absolute;inset:52px 0 0 0;overflow:auto}
#world{position:relative;transform-origin:0 0}
svg#wires{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
svg#wires path{fill:none;stroke:#30425c;stroke-width:1.4}
svg#wires path.hot{stroke:var(--accent);stroke-width:2.2}

/* ---------- карточка экрана ---------- */
.card{position:absolute;width:300px;background:var(--bg2);
      border:1px solid var(--border);border-radius:10px;
      box-shadow:0 6px 18px rgba(0,0,0,.35)}
.card.hot{border-color:var(--accent)}
.card.dim{opacity:.28}
.card .head{padding:8px 10px;border-bottom:1px solid var(--border);cursor:grab;
            border-radius:10px 10px 0 0;background:var(--bg3)}
.card .head:active{cursor:grabbing}
.card .name{font-weight:600;font-size:13px;word-break:break-word}
.card .meta{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);
            margin-top:3px}
.badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:20px;
       border:1px solid var(--border);color:var(--muted);margin-left:5px;
       vertical-align:middle}
.badge.step{border-color:var(--violet);color:var(--violet)}
.badge.menu{border-color:var(--good);color:var(--good)}
.badge.router{border-color:var(--amber);color:var(--amber)}
.badge.root{border-color:var(--accent);color:var(--accent)}

.btns{list-style:none;margin:0;padding:5px;min-height:26px}
.btns li{display:flex;align-items:flex-start;gap:6px;padding:5px 6px;
         border-radius:7px;cursor:grab;border:1px solid transparent}
.btns li:hover{background:var(--bg3);border-color:var(--border)}
.btns li.dragging{opacity:.4}
.btns li.moved{border-color:var(--violet)}
.grip{color:var(--muted);font-size:11px;line-height:18px;user-select:none}
.lab{flex:1;outline:none;line-height:1.35;word-break:break-word}
.lab:focus{background:var(--bg);box-shadow:0 0 0 2px var(--accent) inset;
           border-radius:4px;padding:0 3px}
.lab.edited{color:var(--violet)}
.sub{font-family:var(--font-mono);font-size:10px;color:var(--muted);
     margin-top:2px;word-break:break-all}
.sub .to{color:#4d7ea8;cursor:pointer}
.sub .to:hover{color:var(--accent);text-decoration:underline}
.sub .dead{color:var(--red)}
.sub .vary{color:var(--amber)}
.drop-here{outline:2px dashed var(--accent);outline-offset:-3px}

/* ---------- боковая панель правок ---------- */
aside{position:fixed;top:52px;right:0;bottom:0;width:390px;max-width:92vw;
      background:var(--bg2);border-left:1px solid var(--border);z-index:25;
      display:none;flex-direction:column}
aside.on{display:flex}
aside h2{margin:0;padding:12px 14px;font-size:14px;border-bottom:1px solid var(--border)}
aside .body{flex:1;overflow:auto;padding:12px 14px}
aside .foot{padding:10px 14px;border-top:1px solid var(--border);
            display:flex;gap:8px;flex-wrap:wrap}
.diff{margin:0 0 14px}
.diff h3{font-size:12px;color:var(--muted);margin:0 0 6px;font-weight:600;
         text-transform:uppercase;letter-spacing:.04em}
.diff ul{margin:0;padding-left:16px}
.diff li{margin-bottom:5px;line-height:1.4}
.was{color:var(--muted);text-decoration:line-through}
.now{color:var(--violet)}
textarea{width:100%;height:150px;background:var(--bg);color:var(--fg);
         border:1px solid var(--border);border-radius:7px;font-family:var(--font-mono);
         font-size:11px;padding:8px;resize:vertical}
.empty{color:var(--muted);line-height:1.5}
.hint{color:var(--muted);font-size:12px;line-height:1.5;margin:0 0 12px}

@media (max-width:760px){
  .card{width:260px}
  aside{width:100%}
}
</style>
</head>
<body>

<header>
  <h1>Карта экранов<small id="stamp"></small></h1>
  <div class="tabs" id="tabs">
    <button data-side="admin" class="on">Админ</button>
    <button data-side="client">Клиент</button>
    <button data-side="all">Всё</button>
  </div>
  <input type="search" id="q" placeholder="искать кнопку или экран…">
  <label class="chk"><input type="checkbox" id="showWires" checked> связи</label>
  <label class="chk"><input type="checkbox" id="showOrphans"> недостижимые</label>
  <span class="spacer"></span>
  <span class="count" id="count"></span>
  <button class="btn" id="relayout">Разложить заново</button>
  <button class="btn" id="openDiff">Мои правки <span id="diffN"></span></button>
</header>

<div id="canvas"><div id="world"><svg id="wires"></svg></div></div>

<aside id="panel">
  <h2>Что я здесь поменял</h2>
  <div class="body" id="diffBody"></div>
  <div class="foot">
    <button class="btn" id="copyDiff">Скопировать</button>
    <button class="btn" id="saveFile">Сохранить файлом</button>
    <button class="btn warn" id="reset">Вернуть как в коде</button>
    <button class="btn" id="closeDiff">Закрыть</button>
  </div>
</aside>

<script src="frontmap.data.js"></script>
<script>
(function () {
"use strict";

var DATA = window.FRONTMAP;
if (!DATA) {
  document.body.innerHTML =
    '<div style="padding:40px;line-height:1.6">' +
    '<b>Нет файла с картой.</b><br>Соберите его: ' +
    '<code>python docs/assets/build_frontmap.py</code></div>';
  return;
}

// Корни: с них человек начинает. Всё, до чего от них не дойти, — отдельный
// разговор, и таких экранов в проекте хватает.
var ROOT = {admin: "main_menu", client: "send_client_menu"};
var STORE = "frontmap.v1";

// ---------------------------------------------------------------- состояние
// Правки живут отдельно от данных: данные пересобираются из кода в любой
// момент, и затирать ими чужую работу нельзя. Поэтому храним не карту целиком,
// а только отличия — куда сдвинули, что переименовали, что переставили.
var edits = load();
function load() {
  try {
    var raw = localStorage.getItem(STORE);
    var v = raw ? JSON.parse(raw) : null;
    if (v && v.labels && v.pos && v.moves) return v;
  } catch (e) { /* приватное окно или очищенные данные — начнём с чистого */ }
  return {labels: {}, pos: {}, moves: {}, order: {}, side: "admin"};
}
function save() {
  try { localStorage.setItem(STORE, JSON.stringify(edits)); }
  catch (e) { /* не сохранилось — работать это не мешает */ }
  paintDiffCount();
}

var byId = {};
DATA.screens.forEach(function (s) {
  // Имя экрана встречается дважды, если функция определена в двух местах.
  // Берём первую: карта показывает связи, а не таблицу символов.
  if (!byId[s.id]) byId[s.id] = s;
});

// Ключ кнопки: экран + её callback_data. `data` бывает одинаковой на разных
// экранах («🔙 Главное меню» везде), поэтому экран в ключе обязателен.
function keyOf(sid, b) { return sid + "␀" + b.data + "␀" + b.line; }

// Подпись — это НАСТРОЙКА, а не пометка на картинке. Ключ у неё один на весь
// проект: `callback_data`. Поэтому переименование кнопки «🔙 Главное меню»
// меняет её на всех экранах разом — так же, как это сделает сам бот, прочитав
// config/buttons.json. Показать здесь иначе значило бы соврать о последствиях.
function labelOf(sid, b) {
  var d = b.data;
  if (d in edits.labels) return edits.labels[d];
  return b.label;
}

// Кнопку с подписью или адресом «на лету» настроить нельзя: её `callback_data`
// каждый раз другая, и ключа для конфига просто не существует.
function tunable(b) {
  return b.data && b.data !== "«меняется»" &&
         b.data.indexOf("…") < 0 && b.data.indexOf("url:") !== 0;
}

// Сколько экранов покажут эту же кнопку. Переименовывая, человек должен
// видеть, что трогает не одно место.
var spread = {};
DATA.screens.forEach(function (s) {
  s.buttons.forEach(function (b) {
    if (!spread[b.data]) spread[b.data] = {};
    spread[b.data][s.id] = 1;
  });
});
function spreadOf(d) { return Object.keys(spread[d] || {}).length; }

// Где кнопка живёт сейчас: на своём экране или перенесённая на другой.
function homeOf(sid, b) {
  var k = keyOf(sid, b);
  return edits.moves[k] || sid;
}

var side = edits.side || "admin";
var wires = document.getElementById("wires");
var world = document.getElementById("world");
var canvas = document.getElementById("canvas");

// --------------------------------------------------------------- досягаемость
// Глубина от корня. Она же задаёт колонки: чем дальше от начала, тем правее.
function depths(rootId) {
  var d = {}, queue = [rootId], i = 0;
  if (!byId[rootId]) return d;
  d[rootId] = 0;
  while (i < queue.length) {
    var id = queue[i++], s = byId[id];
    if (!s) continue;
    visibleButtons(id).forEach(function (b) {
      var to = b.to;
      if (!to || !byId[to] || to in d) return;
      d[to] = d[id] + 1;
      queue.push(to);
    });
  }
  return d;
}

// Кнопки экрана с учётом правок: свои минус унесённые, плюс принесённые.
function visibleButtons(sid) {
  var out = [];
  DATA.screens.forEach(function (s) {
    s.buttons.forEach(function (b) {
      if (homeOf(s.id, b) === sid) out.push({b: b, from: s.id});
    });
  });
  var ord = edits.order[sid];
  if (ord) {
    out.sort(function (x, y) {
      var a = ord.indexOf(keyOf(x.from, x.b)), c = ord.indexOf(keyOf(y.from, y.b));
      return (a < 0 ? 999 : a) - (c < 0 ? 999 : c);
    });
  }
  return out.map(function (x) { return {b: x.b, from: x.from, to: x.b.to,
                                        data: x.b.data, line: x.b.line}; });
}

// ------------------------------------------------------------------- отрисовка
var cards = {};

function screensFor(sideName) {
  var all = DATA.screens.filter(function (s) {
    return sideName === "all" ? true : s.side === sideName;
  });
  // У клиента корень — его кабинет; на «всё» считаем от обоих.
  var d = {};
  var roots = sideName === "all" ? [ROOT.admin, ROOT.client] : [ROOT[sideName]];
  roots.forEach(function (r) {
    var got = depths(r);
    Object.keys(got).forEach(function (k) {
      if (!(k in d) || got[k] < d[k]) d[k] = got[k];
    });
  });
  var seen = {};
  var list = [];
  all.forEach(function (s) {
    if (seen[s.id]) return;
    seen[s.id] = 1;
    list.push({s: s, depth: (s.id in d) ? d[s.id] : -1});
  });
  return list;
}

function layout(list) {
  // Раскладываем колонками по глубине. Недостижимые — в свою колонку справа,
  // за отбивкой: смешивать их с деревом значит прятать их среди рабочих.
  var cols = {}, maxDepth = 0;
  list.forEach(function (it) {
    if (it.depth > maxDepth) maxDepth = it.depth;
  });
  var COLW = 340, GAP = 16, PAD = 24;
  list.forEach(function (it) {
    var col = it.depth < 0 ? maxDepth + 2 : it.depth;
    if (!cols[col]) cols[col] = 0;
    it.x = PAD + col * COLW;
    it.y = PAD + cols[col];
    cols[col] += 70 + 30 * Math.max(1, countButtons(it.s.id)) + GAP;
  });
  var w = PAD + (maxDepth + 3) * COLW;
  var h = PAD;
  Object.keys(cols).forEach(function (c) { if (cols[c] + PAD > h) h = cols[c] + PAD; });
  world.style.width = w + "px";
  world.style.height = h + "px";
  wires.setAttribute("width", w);
  wires.setAttribute("height", h);
}

function countButtons(sid) {
  var n = 0;
  DATA.screens.forEach(function (s) {
    s.buttons.forEach(function (b) { if (homeOf(s.id, b) === sid) n++; });
  });
  return n;
}

function render() {
  Object.keys(cards).forEach(function (k) { cards[k].el.remove(); });
  cards = {};
  var list = screensFor(side);
  var showOrphans = document.getElementById("showOrphans").checked;
  if (!showOrphans) list = list.filter(function (it) { return it.depth >= 0; });
  layout(list);

  list.forEach(function (it) {
    var el = card(it);
    world.appendChild(el);
    var p = edits.pos[it.s.id];
    var x = p ? p[0] : it.x, y = p ? p[1] : it.y;
    el.style.left = x + "px";
    el.style.top = y + "px";
    cards[it.s.id] = {el: el, s: it.s, x: x, y: y};
  });

  document.getElementById("count").textContent =
    list.length + " экранов · " +
    list.reduce(function (a, it) { return a + countButtons(it.s.id); }, 0) + " кнопок";
  drawWires();
  applySearch();
}

function card(it) {
  var s = it.s;
  var el = document.createElement("div");
  el.className = "card";
  el.dataset.id = s.id;

  var head = document.createElement("div");
  head.className = "head";
  var kind = s.kind === "step" ? "шаг" : s.kind === "menu" ? "меню"
           : s.kind === "router" ? "роутер" : "";
  var isRoot = s.id === ROOT.admin || s.id === ROOT.client;
  head.innerHTML =
    '<div class="name">' + esc(s.title || s.id) +
    (isRoot ? '<span class="badge root">начало</span>' : '') +
    (kind ? '<span class="badge ' + s.kind + '">' + kind + '</span>' : '') +
    (it.depth < 0 ? '<span class="badge">не дойти</span>' : '') +
    '</div>' +
    '<div class="meta">' + esc(s.id) + ' · ' + esc(s.file) + ':' + s.line + '</div>';
  el.appendChild(head);

  var ul = document.createElement("ul");
  ul.className = "btns";
  ul.dataset.screen = s.id;
  visibleButtons(s.id).forEach(function (x) { ul.appendChild(row(s.id, x)); });
  el.appendChild(ul);

  dragCard(el, head, s.id);
  return el;
}

function row(sid, x) {
  var b = x.b, li = document.createElement("li");
  li.draggable = true;
  li.dataset.key = keyOf(x.from, b);
  li.dataset.from = x.from;
  if (x.from !== sid) li.className = "moved";

  var grip = document.createElement("span");
  grip.className = "grip";
  grip.textContent = "⠿";
  li.appendChild(grip);

  var wrap = document.createElement("div");
  wrap.style.flex = "1";
  var lab = document.createElement("div");
  var canEdit = tunable(b);
  lab.className = "lab" + ((b.data in edits.labels) ? " edited" : "");
  lab.contentEditable = canEdit ? "true" : "false";
  lab.spellcheck = false;
  lab.textContent = labelOf(x.from, b);
  if (!canEdit) lab.title = "Подпись собирается на лету — настроить нельзя";
  lab.addEventListener("blur", function () {
    if (!canEdit) return;
    var v = lab.textContent.trim();
    var base = (b.code_label !== undefined) ? b.code_label : b.label;
    if (!v || v === base) delete edits.labels[b.data];
    else edits.labels[b.data] = v;
    lab.classList.toggle("edited", b.data in edits.labels);
    save();
    render();
  });
  lab.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); lab.blur(); }
  });
  // Перетаскивание и правка текста дерутся за мышь: пока правим — не тащим.
  lab.addEventListener("focus", function () { li.draggable = false; });
  lab.addEventListener("blur", function () { li.draggable = true; });
  wrap.appendChild(lab);

  var sub = document.createElement("div");
  sub.className = "sub";
  var dataTxt = b.data === "«меняется»"
    ? '<span class="vary">подпись и адрес собираются на лету</span>'
    : esc(b.data);
  var toTxt = b.to && byId[b.to]
    ? ' → <span class="to" data-to="' + esc(b.to) + '">' + esc(b.to) + '</span>'
    : b.to
      ? ' → ' + esc(b.to) + ' <span class="vary">(не экран)</span>'
      : (b.how === "подставляется на лету"
          ? ' <span class="vary">→ разбирается на лету</span>'
          : String(b.data).indexOf("url:") === 0
            ? ' <span class="vary">→ внешняя ссылка</span>'
            : ' <span class="dead">→ ветки в роутере нет</span>');
  var n = spreadOf(b.data);
  var many = (n > 1 && tunable(b))
    ? ' <span class="vary">· на ' + n + ' экранах</span>' : '';
  sub.innerHTML = dataTxt + toTxt + many;
  wrap.appendChild(sub);
  li.appendChild(wrap);

  sub.addEventListener("click", function (e) {
    var t = e.target.getAttribute("data-to");
    if (t) focusCard(t);
  });
  return li;
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c];
  });
}

// ---------------------------------------------------------- перетаскивание
function dragCard(el, handle, id) {
  handle.addEventListener("mousedown", function (e) {
    if (e.button !== 0) return;
    e.preventDefault();
    var sx = e.clientX, sy = e.clientY;
    var ox = parseFloat(el.style.left), oy = parseFloat(el.style.top);
    el.style.zIndex = 10;
    function move(ev) {
      var x = Math.max(0, ox + ev.clientX - sx), y = Math.max(0, oy + ev.clientY - sy);
      el.style.left = x + "px";
      el.style.top = y + "px";
      cards[id].x = x; cards[id].y = y;
      drawWires();
    }
    function up() {
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
      el.style.zIndex = "";
      edits.pos[id] = [cards[id].x, cards[id].y];
      save();
    }
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
  });
}

var dragging = null;
document.addEventListener("dragstart", function (e) {
  var li = e.target.closest ? e.target.closest("li[data-key]") : null;
  if (!li) return;
  dragging = li;
  li.classList.add("dragging");
  try { e.dataTransfer.setData("text/plain", li.dataset.key); } catch (x) {}
  e.dataTransfer.effectAllowed = "move";
});
document.addEventListener("dragend", function () {
  if (dragging) dragging.classList.remove("dragging");
  dragging = null;
  document.querySelectorAll(".drop-here").forEach(function (n) {
    n.classList.remove("drop-here");
  });
});
document.addEventListener("dragover", function (e) {
  var ul = e.target.closest ? e.target.closest("ul.btns") : null;
  if (!ul || !dragging) return;
  e.preventDefault();
  ul.classList.add("drop-here");
  var after = below(ul, e.clientY);
  if (after == null) ul.appendChild(dragging);
  else ul.insertBefore(dragging, after);
});
document.addEventListener("dragleave", function (e) {
  var ul = e.target.closest ? e.target.closest("ul.btns") : null;
  if (ul) ul.classList.remove("drop-here");
});
document.addEventListener("drop", function (e) {
  var ul = e.target.closest ? e.target.closest("ul.btns") : null;
  if (!ul || !dragging) return;
  e.preventDefault();
  ul.classList.remove("drop-here");
  var sid = ul.dataset.screen, key = dragging.dataset.key;
  var origin = key.split("␀")[0];
  if (origin === sid) delete edits.moves[key]; else edits.moves[key] = sid;
  dragging.classList.toggle("moved", origin !== sid);
  // Порядок запоминаем целиком по этому экрану: иначе при следующем открытии
  // кнопки встанут как в коде, и работа пропадёт.
  edits.order[sid] = Array.prototype.map.call(
    ul.querySelectorAll("li[data-key]"), function (n) { return n.dataset.key; });
  save();
  drawWires();
});

function below(ul, y) {
  var items = Array.prototype.slice.call(
    ul.querySelectorAll("li[data-key]:not(.dragging)"));
  for (var i = 0; i < items.length; i++) {
    var r = items[i].getBoundingClientRect();
    if (y < r.top + r.height / 2) return items[i];
  }
  return null;
}

// -------------------------------------------------------------------- связи
function drawWires() {
  if (!document.getElementById("showWires").checked) { wires.innerHTML = ""; return; }
  var seen = {}, parts = [];
  Object.keys(cards).forEach(function (sid) {
    visibleButtons(sid).forEach(function (x) {
      var to = x.b.to;
      if (!to || !cards[to] || to === sid) return;
      var k = sid + ">" + to;
      if (seen[k]) return;
      seen[k] = 1;
      var a = cards[sid], c = cards[to];
      var ah = a.el.offsetHeight, ch = c.el.offsetHeight;
      var x1 = a.x + a.el.offsetWidth, y1 = a.y + ah / 2;
      var x2 = c.x, y2 = c.y + ch / 2;
      var dx = Math.max(40, Math.abs(x2 - x1) / 2);
      parts.push('<path data-a="' + esc(sid) + '" data-b="' + esc(to) + '" d="M' +
        x1 + ',' + y1 + ' C' + (x1 + dx) + ',' + y1 + ' ' +
        (x2 - dx) + ',' + y2 + ' ' + x2 + ',' + y2 + '"/>');
    });
  });
  wires.innerHTML = parts.join("");
}

function focusCard(id) {
  var c = cards[id];
  if (!c) return;
  Object.keys(cards).forEach(function (k) { cards[k].el.classList.remove("hot"); });
  c.el.classList.add("hot");
  canvas.scrollTo({left: Math.max(0, c.x - 120), top: Math.max(0, c.y - 80),
                   behavior: "smooth"});
}

// -------------------------------------------------------------------- поиск
function applySearch() {
  var q = document.getElementById("q").value.trim().toLowerCase();
  Object.keys(cards).forEach(function (id) {
    if (!q) { cards[id].el.classList.remove("dim"); return; }
    var hay = (id + " " + (cards[id].s.title || "") + " " +
      visibleButtons(id).map(function (x) {
        return labelOf(x.from, x.b) + " " + x.b.data;
      }).join(" ")).toLowerCase();
    cards[id].el.classList.toggle("dim", hay.indexOf(q) < 0);
  });
}

// -------------------------------------------------------------------- правки
function diffList() {
  var out = {labels: [], moves: [], order: [], pos: 0};
  var seenData = {};
  DATA.screens.forEach(function (s) {
    s.buttons.forEach(function (b) {
      var base = (b.code_label !== undefined) ? b.code_label : b.label;
      if ((b.data in edits.labels) && edits.labels[b.data] !== base
          && !seenData[b.data]) {
        seenData[b.data] = 1;
        out.labels.push({was: base, now: edits.labels[b.data], data: b.data,
                         where: spreadOf(b.data)});
      }
      var k = keyOf(s.id, b);
      if (edits.moves[k])
        out.moves.push({label: labelOf(s.id, b), from: s.id, to: edits.moves[k]});
    });
  });
  Object.keys(edits.order).forEach(function (sid) { out.order.push(sid); });
  out.pos = Object.keys(edits.pos).length;
  return out;
}

// Содержимое config/buttons.json: то, что реально поедет в бота. Уже
// применённые имена из действующего конфига сохраняем — иначе выгрузка стёрла
// бы всё, чего человек не трогал в этот раз.
function configJson() {
  var cfg = {"_": "Подписи кнопок бота. Ключ — callback_data, значение — что " +
                  "видит человек. Пусто = как в коде. Правится руками или " +
                  "через docs/assets/frontmap.html."};
  Object.keys(DATA.names || {}).forEach(function (k) { cfg[k] = DATA.names[k]; });
  Object.keys(edits.labels).forEach(function (k) { cfg[k] = edits.labels[k]; });
  return JSON.stringify(cfg, null, 2) + "\n";
}

function paintDiffCount() {
  var d = diffList();
  var n = d.labels.length + d.moves.length;
  document.getElementById("diffN").textContent = n ? "· " + n : "";
}

function paintDiff() {
  var d = diffList(), h = [];
  h.push('<p class="hint">Подписи — настоящая настройка: сохраните файл в ' +
         '<b>config/buttons.json</b>, и бот возьмёт их при следующей выкладке. ' +
         'Раскладка (порядок, переносы, положение) остаётся наброском — её ' +
         'переносят в код руками.</p>');
  if (d.labels.length) {
    h.push('<div class="diff"><h3>Переименовано · поедет в бота</h3><ul>');
    d.labels.forEach(function (x) {
      h.push('<li><span class="was">' + esc(x.was) + '</span> → <span class="now">' +
             esc(x.now) + '</span><div class="sub">' + esc(x.data) +
             (x.where > 1 ? ' · на ' + x.where + ' экранах' : '') +
             '</div></li>');
    });
    h.push('</ul></div>');
  }
  if (d.moves.length) {
    h.push('<div class="diff"><h3>Перенесено · только набросок</h3><ul>');
    d.moves.forEach(function (x) {
      h.push('<li>«' + esc(x.label) + '»<div class="sub">' + esc(x.from) +
             ' → ' + esc(x.to) + '</div></li>');
    });
    h.push('</ul></div>');
  }
  if (d.order.length) {
    h.push('<div class="diff"><h3>Изменён порядок кнопок</h3><ul><li>' +
           d.order.map(esc).join(', ') + '</li></ul></div>');
  }
  if (d.pos) {
    h.push('<div class="diff"><h3>Расположение</h3><ul><li>сдвинуто экранов: ' +
           d.pos + '</li></ul></div>');
  }
  if (!d.labels.length && !d.moves.length && !d.order.length && !d.pos) {
    h.push('<p class="empty">Пока ничего. Щёлкните по подписи кнопки и ' +
           'напишите своё — она окажется здесь и уедет в конфиг. Карточки ' +
           'и порядок кнопок тоже можно двигать.</p>');
  }
  h.push('<div class="diff"><h3>config/buttons.json</h3></div>');
  h.push('<textarea id="dump" readonly>' + esc(configJson()) + '</textarea>');
  document.getElementById("diffBody").innerHTML = h.join("");
}

// ------------------------------------------------------------------ обвязка
document.getElementById("tabs").addEventListener("click", function (e) {
  var b = e.target.closest("button");
  if (!b) return;
  Array.prototype.forEach.call(this.children, function (n) { n.classList.remove("on"); });
  b.classList.add("on");
  side = b.dataset.side;
  edits.side = side;
  save();
  render();
});
document.getElementById("q").addEventListener("input", applySearch);
document.getElementById("showWires").addEventListener("change", drawWires);
document.getElementById("showOrphans").addEventListener("change", render);
document.getElementById("relayout").addEventListener("click", function () {
  edits.pos = {};
  save();
  render();
});
document.getElementById("openDiff").addEventListener("click", function () {
  paintDiff();
  document.getElementById("panel").classList.add("on");
});
document.getElementById("closeDiff").addEventListener("click", function () {
  document.getElementById("panel").classList.remove("on");
});
document.getElementById("copyDiff").addEventListener("click", function () {
  var t = document.getElementById("dump");
  t.select();
  try { document.execCommand("copy"); this.textContent = "Скопировано"; }
  catch (e) { this.textContent = "Выделено — Ctrl+C"; }
  var me = this;
  setTimeout(function () { me.textContent = "Скопировать"; }, 1600);
});
document.getElementById("saveFile").addEventListener("click", function () {
  var blob = new Blob([configJson()], {type: "application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "buttons.json";
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
});
document.getElementById("reset").addEventListener("click", function () {
  // Спрашиваем: работа могла копиться неделями, а кнопка стоит рядом с
  // «закрыть» и промахнуться мимо неё легко.
  if (!confirm("Стереть все правки и вернуть карту к тому, что в коде?")) return;
  edits = {labels: {}, pos: {}, moves: {}, order: {}, side: side};
  save();
  render();
  paintDiff();
});

document.getElementById("stamp").textContent =
  " — " + DATA.counts.screens + " экранов, " + DATA.counts.buttons + " кнопок";

// Вкладка запоминается: возвращаясь, человек хочет туда же, где был.
Array.prototype.forEach.call(document.getElementById("tabs").children, function (b) {
  b.classList.toggle("on", b.dataset.side === side);
});

render();
paintDiffCount();
})();
</script>
</body>
</html>
