# Создаем статичную сеть для решения проблемы резолва DNS при network_mode
networks:
  vpn_net:
    ipam:
      config:
        - subnet: 172.20.0.0/24

services:
  # ---------------- POSTGRES ----------------
  postgres:
    image: postgres:15
    container_name: vpn_db
    restart: always
    networks:
      vpn_net:
        ipv4_address: 172.20.0.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    # Потолок памяти: измеренное потребление 70 МБ, запас пятикратный.
    mem_limit: 384m
    volumes:
      - ./volumes/database:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------- AMNEZIA WG (MASTER) ----------------
  ru_wireguard:
    build: ./ru_wg_api
    # Тег образа — версия проекта из файла VERSION (её экспортирует deploy.sh/install.sh).
    # Без latest: по `docker images` сразу видно, какая версия реально крутится на ноде.
    image: vpn-ru-wireguard:${APP_VERSION:-dev}
    container_name: vpn_wireguard
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    networks:
      vpn_net:
        ipv4_address: 172.20.0.6
    environment:
      SERVERPORT: 51820
      INTERNAL_SUBNET: 10.13.13.0
      # Токен панели: второй рубеж поверх правил файрвола. Пустой — узел работает
      # как раньше, обновление ничего не ломает.
      API_TOKEN: ${API_TOKEN:-}
      API_TOKEN_PREV: ${API_TOKEN_PREV:-}
    # Потолок памяти. Измерено 105 МБ, всплески — при разборе списков
    # фильтров. Полгигабайта — с запасом.
    mem_limit: 512m
    volumes:
      - ./volumes/wireguard:/etc/amnezia/amneziawg
      - /lib/modules:/lib/modules
      # Сертификат — только на чтение. Нужен странице отказа: на СВОИ имена
      # («дом.example.ru», «закрыто.example.ru») он настоящий, и страница
      # открывается без предупреждения браузера. Нет его — страница работает
      # как раньше, на самоподписанном.
      - ./volumes/certs:/certs:ro
    ports:
      - "51820:51820/udp"
      # Стек Xray (панель 3X-UI, сервис xui ниже) живёт в этой же сетевой
      # области, поэтому его порты публикуются здесь: 443 — вход, 2096 —
      # подписка. Опубликованы всегда, а пропускает их узел, только пока
      # владелец включил стек: цепочка XRAY_GATE в ru_wg_api/api.py. Выключен —
      # снаружи порты молчат как закрытые.
      - "443:443/tcp"
      - "2096:2096/tcp"
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------- BOT (FRONTEND) ----------------
  vpn_bot:
    build: ./bot
    image: vpn-ru-bot:${APP_VERSION:-dev}
    container_name: vpn_bot
    # Бот делит сеть с WireGuard для обхода блокировок Telegram
    network_mode: "service:ru_wireguard"
    depends_on:
      - postgres
      - ru_wireguard
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_ID: ${ADMIN_ID}
      # Обращаемся к БД по жесткому IP, так как DNS Docker'а недоступен в network_mode
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@172.20.0.5:5432/${POSTGRES_DB}
      GIT_REPO: ${GIT_REPO}
      GIT_USERNAME: ${GIT_USERNAME}
      GIT_TOKEN: ${GIT_TOKEN}
      API_TOKEN: ${API_TOKEN:-}
      API_TOKEN_PREV: ${API_TOKEN_PREV:-}
      # Пароль архива бэкапов. Без этой строки он оставался в .env и до
      # бота не доезжал: compose передаёт в контейнер только то, что
      # перечислено здесь. Бот считал, что пароль не задан, и просил снова.
      BACKUP_PASSWORD: ${BACKUP_PASSWORD:-}
      # Своё имя узла, если владелец его завёл. Пусто — работаем по адресу.
      #
      # Зачем оно: зона имён внутри туннеля («дом.example.ru») и настоящий
      # сертификат на неё — для страницы отказа и своих сервисов.
      #
      # Задаётся из бота и им же дописывается в .env: своими руками в файл
      # никто не лезет, как и с паролем архива.
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-}
      # Где лежит сертификат. Папка volumes монтируется целиком, так что
      # продление доезжает до бота само.
      SUB_CERT_DIR: /volumes/certs
      # Включён ли стек Xray. Это те же профили compose, которыми хост
      # поднимает или не поднимает контейнер 3X-UI: одна переменная на двоих,
      # и разойтись им не в чем. Меняет её бот — кнопкой в «Протоколах».
      XRAY_STACK: ${COMPOSE_PROFILES:-}
      WG_API_URL: http://127.0.0.1:8000/api
      # IP адрес агента в Германии внутри туннеля
      DE_AGENT_URL: http://10.13.13.254:8000/api
    # Потолок памяти: измерено 107 МБ, но бот рисует графики и собирает
    # Excel — на этом бывают всплески, поэтому запас пятикратный.
    mem_limit: 512m
    volumes:
      - ./volumes:/volumes
      # Версия — ОДНА на весь проект, из корня. Раньше монтировался
      # VPS_RU/VERSION, который никто не обновлял, и бот показывал старый номер.
      - ../VERSION:/app/VERSION_FILE:ro
      # Ченджлог лежит в корне репозитория, а собирается образ из папки bot —
      # поэтому монтируем файлом, а не копируем при сборке.
      - ../CHANGELOG.md:/app/CHANGELOG.md:ro
      # Тесты и сверка состояния. Волюмом, а не копией при сборке: правка
      # проверки не должна требовать пересборки образа и перезапуска бота.
      # Только на чтение — сверка по определению ничего не меняет.
      - ../tests:/app/tests:ro
      # Подписи кнопок — плоский конфиг проекта. Файлом, а не копией при
      # сборке: переименовать кнопку не должно значить пересобрать образ.
      - ../config/buttons.json:/app/buttons.json:ro
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------- XRAY: ПАНЕЛЬ 3X-UI ----------------
  # Второй канал связи. Не свой Xray, а готовая панель: входы, подписки,
  # статистика и шаблоны под блокировки в ней уже есть и обновляются
  # сообществом, а бот управляет ею по API.
  #
  # Включается профилем: без `COMPOSE_PROFILES=xray` в .env контейнера нет
  # вовсе, и ресурсов он не ест. Переменную меняет бот, пересоздаёт хост.
  #
  # Сеть — общая с узлом. Так исходящий трафик Xray сам идёт по правилам
  # узла: российское — напрямую, остальное и заблокированное — через Германию,
  # ответы на входящие — обратно тем же путём. Порты публикует ru_wireguard.
  xui:
    image: ${XUI_IMAGE:-ghcr.io/mhsanaei/3x-ui:v3.8.5}
    container_name: vpn_xui
    profiles: ["xray"]
    network_mode: "service:ru_wireguard"
    depends_on:
      - ru_wireguard
    environment:
      # Fail2ban панели правит iptables — а таблицы здесь общие с узлом и
      # целиком принадлежат ему. Выключен.
      XUI_ENABLE_FAIL2BAN: "false"
      XUI_PORT: "2053"
      # Мягкий потолок памяти Go ниже жёсткого контейнерного: сборщик мусора
      # успевает раньше, чем придёт OOM.
      GOMEMLIMIT: "300MiB"
      TZ: Europe/Moscow
    mem_limit: 384m
    volumes:
      - ./volumes/xui:/etc/x-ui
      # Сертификат узла — для подписки по HTTPS на своём домене.
      - ./volumes/certs:/certs:ro
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
