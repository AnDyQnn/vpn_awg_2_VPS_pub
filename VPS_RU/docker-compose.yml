# Создаем статичную сеть для решения проблемы резолва DNS при network_mode
networks:
  vpn_net:
    ipam:
      config:
        - subnet: 172.20.0.0/24

services:
  # ---------------- POSTGRES ----------------
  postgres:
    image: postgres:15
    container_name: vpn_db
    restart: always
    networks:
      vpn_net:
        ipv4_address: 172.20.0.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    # Потолок памяти: измеренное потребление 70 МБ, запас пятикратный.
    mem_limit: 384m
    volumes:
      - ./volumes/database:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------- AMNEZIA WG (MASTER) ----------------
  ru_wireguard:
    build: ./ru_wg_api
    # Тег образа — версия проекта из файла VERSION (её экспортирует deploy.sh/install.sh).
    # Без latest: по `docker images` сразу видно, какая версия реально крутится на ноде.
    image: vpn-ru-wireguard:${APP_VERSION:-dev}
    container_name: vpn_wireguard
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    networks:
      vpn_net:
        ipv4_address: 172.20.0.6
    environment:
      SERVERPORT: 51820
      INTERNAL_SUBNET: 10.13.13.0
      # Токен панели: второй рубеж поверх правил файрвола. Пустой — узел работает
      # как раньше, обновление ничего не ломает.
      API_TOKEN: ${API_TOKEN:-}
      API_TOKEN_PREV: ${API_TOKEN_PREV:-}
    # Потолок памяти. Измерено 105 МБ; Xray добавит ещё 40–80, а у самого
    # Xray внутри стоит свой потолок в 256 МБ. Полгигабайта — с запасом.
    mem_limit: 512m
    volumes:
      - ./volumes/wireguard:/etc/amnezia/amneziawg
      - /lib/modules:/lib/modules
    ports:
      - "51820:51820/udp"
      # Порт второго интерфейса на время переезда на новый ключ сервера.
      # Без публикации переехавшие просто не достучались бы до узла: изнутри
      # контейнера интерфейс работает, а снаружи его нет.
      - "51821:51821/udp"
      # Вход Xray. Порт 443 выбран не для красоты: трафик к нему неотличим от
      # обычного HTTPS, а его блокировка ломает провайдеру половину интернета.
      - "443:443/tcp"
      # Запасные входы Xray, каждый со своей маской. Нужны на случай, когда
      # основную маску заблокируют: подписка отдаёт человеку все входы, и
      # приложение само переходит на живой. 2053 и 2083 — общеизвестные
      # запасные порты HTTPS, на них ходит настоящий трафик.
      - "2053:2053/tcp"
      - "2083:2083/tcp"
      # Сервер подписок бота (бот делит сеть с этим контейнером, поэтому порт
      # публикуется здесь). По умолчанию виден только с самого сервера: по
      # подписке уходит доступ к VPN, и открывать её в интернет открытым
      # текстом нельзя.
      #
      # Наружу её открывает scripts/public_sub.sh: он берёт бесплатный
      # сертификат прямо на IP-адрес, ставит охрану порта в DOCKER-USER (ufw на
      # порты контейнеров не действует) и пишет сюда SUB_BIND и SUB_PUBLIC_PORT.
      # Само по себе обновление ничего не открывает.
      - "${SUB_BIND:-127.0.0.1}:${SUB_PUBLIC_PORT:-8080}:8080"
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------- BOT (FRONTEND) ----------------
  vpn_bot:
    build: ./bot
    image: vpn-ru-bot:${APP_VERSION:-dev}
    container_name: vpn_bot
    # Бот делит сеть с WireGuard для обхода блокировок Telegram
    network_mode: "service:ru_wireguard"
    depends_on:
      - postgres
      - ru_wireguard
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_ID: ${ADMIN_ID}
      # Обращаемся к БД по жесткому IP, так как DNS Docker'а недоступен в network_mode
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@172.20.0.5:5432/${POSTGRES_DB}
      GIT_REPO: ${GIT_REPO}
      GIT_USERNAME: ${GIT_USERNAME}
      GIT_TOKEN: ${GIT_TOKEN}
      API_TOKEN: ${API_TOKEN:-}
      API_TOKEN_PREV: ${API_TOKEN_PREV:-}
      # Пароль архива бэкапов. Без этой строки он оставался в .env и до
      # бота не доезжал: compose передаёт в контейнер только то, что
      # перечислено здесь. Бот считал, что пароль не задан, и просил снова.
      BACKUP_PASSWORD: ${BACKUP_PASSWORD:-}
      # Порт сервера подписок внутри контейнера. Он всегда 8080: наружу его
      # разворачивает docker, и менять внутренний номер незачем.
      SUB_PORT: 8080
      # Где лежит сертификат на IP-адрес. Папка volumes монтируется целиком,
      # так что продление доезжает до бота само — он сверяет время правки файлов
      # раз в десять минут и перечитывает их без перезапуска.
      SUB_CERT_DIR: /volumes/certs
      WG_API_URL: http://127.0.0.1:8000/api
      # IP адрес агента в Германии внутри туннеля
      DE_AGENT_URL: http://10.13.13.254:8000/api
    # Потолок памяти: измерено 107 МБ, но бот рисует графики и собирает
    # Excel — на этом бывают всплески, поэтому запас пятикратный.
    mem_limit: 512m
    volumes:
      - ./volumes:/volumes
      # Версия — ОДНА на весь проект, из корня. Раньше монтировался
      # VPS_RU/VERSION, который никто не обновлял, и бот показывал старый номер.
      - ../VERSION:/app/VERSION_FILE:ro
      # Ченджлог лежит в корне репозитория, а собирается образ из папки bot —
      # поэтому монтируем файлом, а не копируем при сборке.
      - ../CHANGELOG.md:/app/CHANGELOG.md:ro
      # Тесты и сверка состояния. Волюмом, а не копией при сборке: правка
      # проверки не должна требовать пересборки образа и перезапуска бота.
      # Только на чтение — сверка по определению ничего не меняет.
      - ../tests:/app/tests:ro
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

