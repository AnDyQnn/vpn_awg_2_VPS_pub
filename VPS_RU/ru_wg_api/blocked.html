<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Доступ закрыт</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --fg:#c9d1d9; --muted:#8b949e;
    --border:#30363d; --accent:#58a6ff; --amber:#d29922;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:var(--bg);color:var(--fg);padding:24px;
       font:16px/1.55 "Segoe UI",system-ui,-apple-system,sans-serif}
  .card{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--border);
        border-radius:14px;padding:28px}
  .mark{width:56px;height:56px;margin-bottom:18px}
  h1{margin:0 0 10px;font-size:22px;line-height:1.3}
  p{margin:0 0 14px;color:var(--muted)}
  .domain{display:inline-block;margin:2px 0 16px;padding:7px 12px;border-radius:8px;
          background:#0e1116;border:1px solid var(--border);color:var(--fg);
          font-family:ui-monospace,Consolas,monospace;font-size:15px;word-break:break-all}
  .why{border-left:3px solid var(--amber);padding:10px 14px;background:#1c1710;
       border-radius:0 8px 8px 0;color:var(--fg);font-size:15px}
  .foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--border);
        color:var(--muted);font-size:14px}
</style>
<div class="card">
  <svg class="mark" viewBox="0 0 24 24" fill="none" stroke-width="1.8"
       stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9" stroke="#d29922">
      <animate attributeName="opacity" values="1;0.45;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <path d="M12 7.6 V13" stroke="#d29922"/>
    <circle cx="12" cy="16.4" r="1.2" fill="#d29922">
      <animate attributeName="opacity" values="1;0.15" dur="0.9s"
               calcMode="discrete" keyTimes="0;0.5" repeatCount="indefinite"/>
    </circle>
  </svg>

  <h1>__HEAD__</h1>
  <div class="domain">__DOMAIN__</div>
  <div class="why">__WHY__</div>
  <p style="margin-top:16px">__NOTE__</p>
  <div class="foot">
    Если доступ нужен по делу — напишите владельцу сети, его можно открыть.
  </div>
</div>
</html>
