services:
  de_wireguard:
    build: ./de_agent_api
    # Тег образа — версия проекта из файла VERSION (экспортирует deploy.sh/install.sh)
    image: vpn-de-agent:${APP_VERSION:-dev}
    container_name: de_vpn_agent
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - SERVERPORT=51820
      - INTERNAL_SUBNET=10.13.13.0
      # Должен совпадать с API_TOKEN на мастере
      - API_TOKEN=${API_TOKEN:-}
      - API_TOKEN_PREV=${API_TOKEN_PREV:-}
    # Потолок памяти: измерено 47 МБ при 961 МБ на узле. Запас пятикратный —
    # смысл не в экономии, а в том, чтобы разросшийся процесс падал сам, а не
    # заставлял систему убивать кого попало.
    mem_limit: 256m
    volumes:
      - ./volumes/wireguard:/etc/amnezia/amneziawg
      # Общий том с мостом: агент сюда КЛАДЁТ конфиг и ЧИТАЕТ состояние.
      # Процессом моста он не управляет — тот живёт в своём контейнере и
      # переживает перезапуск агента. В этом и смысл разделения.
      - ./volumes/xray:/etc/xray
      - ./volumes/flags:/volumes/flags
      - /:/hostfs:ro
      - /lib/modules:/lib/modules
    ports:
      - "51820:51820/udp"
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Мост Xray — отдельным контейнером, а не процессом внутри агента.
  #
  # Вся затея со вторым каналом в том, чтобы амнезия и Xray не делили судьбу.
  # Живи мост внутри агента — перезапуск агента (выкладка, сбой, смена конфига
  # туннеля) ронял бы оба канала разом, и по железу они остались бы связаны,
  # хотя по протоколу уже нет.
  #
  # Доступа к докеру у него нет намеренно: конфиг кладёт агент в общий том, а
  # мост сам замечает, что файл изменился, и перезапускается.
  de_xray:
    build: ./xray
    image: vpn-de-xray:${APP_VERSION:-dev}
    container_name: de_vpn_xray
    # Ни привилегий, ни возни с сетью: он только подключается наружу.
    # Портов не публикует — звонит сам, слушать ему нечего.
    environment:
      - XRAY_WATCH_SECONDS=5
    # Измерено на мастере: Xray занимает 40-80 МБ. Потолок нужен не ради
    # экономии, а чтобы разросшийся процесс падал сам и его поднимали заново,
    # а не чтобы система убивала кого попало.
    mem_limit: 256m
    volumes:
      - ./volumes/xray:/etc/xray
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
